name: Documentation Quality

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Markdown files are not empty
        shell: bash
        run: |
          while IFS= read -r file; do
            test -s "$file" || { echo "Empty Markdown: $file"; exit 1; }
          done < <(git ls-files '*.md')
